<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Index</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-6 md:p-12">
    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md p-6 md:p-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-3">作品・ファイル一覧</h1>
        
        <div id="file-list" class="space-y-4">
            <p class="text-gray-500">データを読み込み中...</p>
        </div>

        <div class="mt-10 pt-6 border-t border-gray-200">
            <h2 class="text-sm font-semibold text-gray-600 mb-2">タイトル編集後の data.json 用コード:</h2>
            <p class="text-xs text-gray-500 mb-2">※タイトルを編集したら、下のコードをコピーして <code>data.json</code> に上書き保存してください。</p>
            <textarea id="json-output" class="w-full h-32 p-3 font-mono text-xs bg-gray-100 border rounded-lg focus:outline-none" readonly></textarea>
        </div>
    </div>

    <script>
        let fileData = [];

        // data.json の読み込みと一覧描画
        async function loadFileList() {
            try {
                const response = await fetch('./data.json?v=' + new Date().getTime()); // キャッシュ対策
                fileData = await response.json();
                renderList();
                updateJsonOutput();
            } catch (error) {
                console.error('Error loading data.json:', error);
                document.getElementById('file-list').innerHTML = 
                    '<p class="text-red-500">data.json の読み込みに失敗しました。</p>';
            }
        }

        // リストの描画
        function renderList() {
            const listContainer = document.getElementById('file-list');
            if (fileData.length === 0) {
                listContainer.innerHTML = '<p class="text-gray-500">ファイルがありません。</p>';
                return;
            }

            listContainer.innerHTML = fileData.map((item, index) => `
                <div class="flex flex-col sm:flex-row sm:items-center justify-between p-4 bg-gray-50 hover:bg-gray-100 rounded-lg border transition-colors gap-3">
                    <div class="flex-1">
                        <input 
                            type="text" 
                            value="${escapeHtml(item.title)}" 
                            onchange="updateTitle(${index}, this.value)"
                            class="w-full font-semibold text-gray-800 bg-transparent border-b border-transparent hover:border-gray-300 focus:border-blue-500 focus:bg-white focus:outline-none px-1 py-0.5 rounded transition-all"
                            placeholder="タイトルを入力"
                        />
                        <div class="text-xs text-gray-400 mt-1 px-1">
                            ファイル名: <code class="bg-gray-200 px-1 rounded">${escapeHtml(item.filename)}</code>
                        </div>
                    </div>
                    <a 
                        href="./${encodeURIComponent(item.filename)}" 
                        target="_blank" 
                        class="inline-flex items-center justify-center px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors shrink-0"
                    >
                        開く ↗
                    </a>
                </div>
            `).join('');
        }

        // タイトル変更時の処理
        function updateTitle(index, newTitle) {
            fileData[index].title = newTitle;
            updateJsonOutput();
        }

        // JSON出力エリアの更新
        function updateJsonOutput() {
            document.getElementById('json-output').value = JSON.stringify(fileData, null, 2);
        }

        // HTMLエスケープ処理
        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // 初回実行
        loadFileList();
    </script>
</body>
</html>
